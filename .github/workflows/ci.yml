name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race detector)
        run: go test -race -count=1 -timeout 20m ./...

  # Raft bugs are timing-dependent: a test can pass 49 times and fail once.
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: election + agreement tests x20 with -race
        run: go test -race -count=20 -timeout 45m -run 'Election|Agree' ./raft/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: chaos test (90s of random kill -9)
        run: bash ./deploy/chaos.sh 90 8
